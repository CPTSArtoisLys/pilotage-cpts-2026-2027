name: Synchronisation Plexus

on:
  schedule:
    - cron: '*/15 * * * *'      # toutes les 15 minutes
  workflow_dispatch:             # bouton « Synchroniser » du formulaire

concurrency:
  group: plexus-sync
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Synchroniser avec Plexus
        run: |
          if [ -z "$NC_USER" ] || [ -z "$NC_APP_PASSWORD" ]; then echo "Secrets Plexus non renseignés : synchronisation ignorée."; exit 0; fi
          node scripts/sync.mjs
        env:
          NC_USER: ${{ secrets.NC_USER }}
          NC_APP_PASSWORD: ${{ secrets.NC_APP_PASSWORD }}
          NC_ROOT: /Projets/Bilan annuel ACI 2026-2027
      - name: Republier le site
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
        env:
          GH_TOKEN: ${{ github.token }}
